# RabbitMQ broker configuration for the CFX integration tests.
#
# The CFX SDK (AMQPNetLite, AMQP 1.0) addresses channels using the legacy "v1" address format:
#   /exchange/<name>   and   /queue/<name>
# RabbitMQ 4.0 introduced a new "v2" address format and marked v1 as the deprecated feature
# `amqp_address_v1`. v1 is permitted-by-default in 4.0, but we permit it explicitly so a future
# 4.x release that flips it to denied-by-default does not silently break these tests.
# See https://www.rabbitmq.com/docs/amqp and
#     https://www.rabbitmq.com/release-information/deprecated-features-list
deprecated_features.permit.amqp_address_v1 = true

# Quieter logs for CI output.
log.console = true
log.console.level = warning
